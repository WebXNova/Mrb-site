# Shared reverse-proxy settings for /api → mrb_api upstream
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
# Keep ≤ Cloudflare ~100s proxy limit when CF sits in front of /api (otherwise CF 524
# while Nginx still waits). Node requestTimeout is 125s so Nginx still emits 504 first.
proxy_read_timeout 95s;

# Do not expose upstream errors to clients
proxy_intercept_errors off;
